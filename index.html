<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>30 DAY CONTENT · GTA VI CHALLENGE</title>
  <meta name="theme-color" content="#ff2ec8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
  <main class="stage" aria-label="30 day GTA VI content challenge tracker">
    <img
      class="background-art"
      src="img/tracker-background.png"
      width="1920"
      height="1080"
      alt="30 Day Content GTA VI Challenge artwork with VICEO and vibe_cocos"
    >
    <h1 class="sr-only">30 Day Content GTA VI Challenge</h1>

    <section class="stats-hud" aria-label="Challenge totals">
      <div class="stat-group">
        <strong id="st-viceo-days">0/30</strong>
        <span>VICEO DAYS</span>
        <strong id="st-viceo-clips">0</strong>
        <span>CLIPS</span>
      </div>
      <div class="stat-group stat-total">
        <strong id="st-total">0</strong>
        <span>TOTAL</span>
      </div>
      <div class="stat-group">
        <strong id="st-clipco-days">0/30</strong>
        <span>VIBE_COCOS DAYS</span>
        <strong id="st-clipco-clips">0</strong>
        <span>CLIPS</span>
      </div>
    </section>

    <nav class="tracker-actions" aria-label="Tracker actions">
      <span id="mode-pill" class="pill local">LOCAL</span>
      <button type="button" id="share-btn">SHARE LINK</button>
      <button type="button" id="reset-btn" hidden>RESET</button>
    </nav>

    <section
      class="tracker-board tracker-board-left"
      data-board="viceo"
      data-title="VICEO"
      aria-label="VICEO 30 day tracker"
    ></section>
    <section
      class="tracker-board tracker-board-right"
      data-board="clipco"
      data-title="VIBE_COCOS"
      aria-label="vibe_cocos 30 day tracker"
    ></section>

    <p class="tracker-hint">TAP A DAY TO CHECK IT · TAP THE NUMBER TO SET 0–100</p>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <dialog class="share-dialog" id="share-dialog" aria-labelledby="share-title">
    <div class="share-card">
      <button class="share-close" id="share-close" type="button" aria-label="Close share link">×</button>
      <span class="share-kicker">SHARED BOARD</span>
      <h2 id="share-title">LIVE LINK READY</h2>
      <p>Send this exact link. Both players will see the same days and clip totals.</p>
      <div class="share-link-row">
        <input id="share-url" type="text" readonly aria-label="Unique shared tracker link">
        <button id="copy-share" type="button">COPY LINK</button>
      </div>
      <small>Keep the <b>?b=...</b> part in the link.</small>
    </div>
  </dialog>

  <script type="module" src="js/app.js?v=7"></script>
</body>
</html>
